# Mac mini "brain" tmux — the persistent agent slot sessions (a1..a10, created
# on demand by prefix+digit from any viewer machine) live in this server.
# Push from the MacBook: ~/.config/agent-orchestration/scripts/push-mini-conf.sh
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Multiple viewers (MacBook, PC, phone) may attach the same slot: size to the
# client that last did something instead of the smallest attached client.
set -g window-size latest
setw -g aggressive-resize on

# One green status line = "this pane is on the mini". The viewer-side tmux runs
# status off, so this is the only bar you ever see, and only inside slots.
set -g status on
set -g status-style "bg=#9ece6a,fg=#1a1b26"
set -g status-left " #S "
set -g status-right " mini %H:%M "
