# AeroSpace config

after-login-command = []
after-startup-command = ['exec-and-forget /Users/saxon/.config/agent-orchestration/scripts/layout.sh']

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

accordion-padding = 30
start-at-login = true

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]

# Focus windows
alt-h = 'focus left'
alt-l = 'focus right'
alt-k = 'focus up'
alt-j = 'focus down'

# Move windows (like Hyprland movewindow)
alt-shift-h = 'move left'
alt-shift-l = 'move right'
alt-shift-k = 'move up'
alt-shift-j = 'move down'

# Switch workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 0'

# Move windows to workspaces
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# Reload config
cmd-shift-alt-ctrl-r = 'reload-config'

# Resize focused tile (smart = width if vertical split, height if horizontal)
cmd-shift-up = 'resize smart +100'
cmd-shift-down = 'resize smart -100'
cmd-shift-d = 'balance-sizes'

# Toggle float/tile
cmd-shift-f = 'layout floating tiling'

# Fullscreen
cmd-shift-m = 'fullscreen'

# Arrange the focused workspace into corners: 4 windows -> 2x2 grid.
cmd-shift-g = 'exec-and-forget /Users/saxon/.config/agent-orchestration/scripts/grid2x2.sh'


# New Ghostty window — no `-n`, so it reuses the running instance (no Dock clutter).
# Native cmd+n (Ghostty's new_window) is the main way to add windows to this instance.
cmd-shift-n = 'exec-and-forget open -a Ghostty'


# Browser lives on workspace 1
[[on-window-detected]]
if.app-name-regex-substring = 'Arc'
run = 'move-node-to-workspace 1'

# Ghostty windows are placed by scripts/layout.sh (it switches to the target
# workspace before opening each one), so there is no catch-all rule here —
# ad-hoc terminals just open on the currently focused workspace.
