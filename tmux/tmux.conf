set -g default-terminal "tmux-256color"
set-option -g allow-passthrough on
# extended-keys + extkeys disabled — wildcard "*:extkeys" was mangling pasted LFs
# into CSI-u sequences, leaking "[27;5;106~" into nvim during paste.
# If you want CSI-u back later, scope it to a specific outer terminal that
# actually supports it (e.g. "ghostty:extkeys" or "xterm-kitty:extkeys"),
# not the wildcard.
set -g extended-keys off

set-window-option -g mode-style "bg=#3b4261,fg=#7aa2f7"

set -g status off
# 0 is too far from ` ;)
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers contiguous: closing one shifts the rest down (like browser tabs)
set -g renumber-windows on

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000
set -g mouse on

setw -g mode-keys vi
setw -g monitor-activity on


bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D 
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


##### clean out Ctrleta variants ########################################
unbind -n C-h     # ⌃⌥h
unbind -n C-j     # ⌃⌥j
unbind -n C-k     # ⌃⌥k
unbind -n C-l     # ⌃⌥l
unbind -n C-t     # ⌃⌥l
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down
unbind -n C-1
unbind -n C-2
unbind -n C-3
unbind -n C-4
unbind -n C-5
unbind -n C-6
unbind -n C-7
unbind -n C-8
unbind -n C-9
unbind -n C-0
###########################################################################


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0   # window 0 (or 10 if you use base-index 1)

# ⌃⌥1-9: swap current window with target position, then jump to it
# (base-index 1, so ⌃⌥1 → window 1, ⌃⌥2 → window 2, etc.)
bind -n C-M-1 swap-window -t 1 \; select-window -t 1
bind -n C-M-2 swap-window -t 2 \; select-window -t 2
bind -n C-M-3 swap-window -t 3 \; select-window -t 3
bind -n C-M-4 swap-window -t 4 \; select-window -t 4
bind -n C-M-5 swap-window -t 5 \; select-window -t 5
bind -n C-M-6 swap-window -t 6 \; select-window -t 6
bind -n C-M-7 swap-window -t 7 \; select-window -t 7
bind -n C-M-8 swap-window -t 8 \; select-window -t 8
bind -n C-M-9 swap-window -t 9 \; select-window -t 9

# Shift arrow to switch windows

# Move current window left/right (clamped to existing windows)
bind -n M-H if-shell -F '#{e|>:#{window_index},1}' 'swap-window -t -1'
bind -n M-L if-shell -F '#{e|<:#{window_index},#{session_windows}}' 'swap-window -t +1'

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w killp
# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

